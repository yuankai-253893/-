spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/mental_health_assistant?useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&transformedBitIsBoolean=true&allowMultiQueries=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: ${MYSQL_PASSWORD}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  ai:
    openai:
      chat:
        options:
          model: Qwen/Qwen2.5-7B-Instruct
#          tool-calling:
#            enabled: true
#        completions-path: /v1/chat/completions
      api-key: ${SILICONFLOW_API_KEY}
      base-url: https://api.siliconflow.cn

# Redis配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password:
      database: 0

#mybatis-plus:
#  configuration:
#    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

#    服务器配置
server:
  port: 8080

# JWT配置
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000  # 24小时（毫秒）
#  refresh-expiration: 604800000  # 7天（毫秒）
#  header: Authorization  # token头部名称
#  token-prefix: "Bearer "  # token前缀

file:
  # 注意：Windows 系统路径用正斜杠 / 或者双反斜杠 \\ 都可以
  upload-path: ${FILE_UPLOAD_PATH}

